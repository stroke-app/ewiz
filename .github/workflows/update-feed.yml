name: Update appcast feeds

# Re-publishes the in-app update feeds in stroke-app/ewiz-releases from a *published*
# release's assets: appcast.xml (Sparkle, what the app reads) and appcast.json (the old
# updater in copies up to 0.18.5). The release workflow does this itself on every tag;
# this is the manual way to redo it (workflow_dispatch) or to follow a release published
# by hand.
#
# Requires a repo secret `RELEASES_TOKEN`: a PAT with contents:write on the
# ewiz-releases repo (the default GITHUB_TOKEN can't push to another repo).
# Without it the job simply no-ops.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the feed (e.g. v0.6.1)"
        required: true

permissions:
  contents: read

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Update ewiz-releases appcast.xml and appcast.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASES_TOKEN not set — skipping feed update."
            exit 0
          fi

          VERSION="${TAG#v}"
          FEED_REPO="stroke-app/ewiz-releases"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/eWiz-${VERSION}.dmg"
          NOTES="eWiz ${VERSION}"

          # Publishes one feed file as-is; a file the repo doesn't have yet is created.
          publish() {
            local name="$1" path="$2"
            local sha
            sha=$(gh api "repos/${FEED_REPO}/contents/${name}" --jq .sha 2>/dev/null) || sha=""
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${FEED_REPO}/contents/${name}" \
                -f message="chore: update ${name} to ${VERSION}" \
                -f content="$(base64 < "$path" | tr -d '\n')" -f sha="$sha"
            else
              gh api -X PUT "repos/${FEED_REPO}/contents/${name}" \
                -f message="chore: update ${name} to ${VERSION}" \
                -f content="$(base64 < "$path" | tr -d '\n')"
            fi
            echo "${name} updated to ${VERSION}."
          }

          # The appcasts the release carries, so the signatures come with them.
          # appcast.xml: only releases built with Sparkle have one; without it the
          # Sparkle feed is left alone (an older release can't be served to Sparkle).
          if GH_TOKEN="$REPO_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
               --pattern appcast.xml --output /tmp/appcast.xml 2>/dev/null; then
            publish appcast.xml /tmp/appcast.xml
          else
            echo "Release $TAG has no appcast.xml — leaving the Sparkle feed as it is."
          fi

          # appcast.json: a release from before signing has none; fall back to the bare entry.
          if GH_TOKEN="$REPO_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
               --pattern appcast.json --output /tmp/appcast.json 2>/dev/null; then
            python3 -c 'import json; print(json.dumps(json.load(open("/tmp/appcast.json")), separators=(",", ":")))' > /tmp/appcast.min.json
          else
            printf '{"version":"%s","url":"%s","notes":"%s"}' "$VERSION" "$DMG_URL" "$NOTES" > /tmp/appcast.min.json
          fi
          cat /tmp/appcast.min.json; echo
          publish appcast.json /tmp/appcast.min.json
