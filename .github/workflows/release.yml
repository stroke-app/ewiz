name: Release

# Builds eWiz on every tag push (v0.1.0…) or manual run.
# - With Apple secrets set: Developer-ID signed + notarized DMG.
# - Without them: an unsigned build (fine for testing the pipeline; end users
#   would see a Gatekeeper warning).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    # Build on macOS 26 so the binary links against the macOS 26 SDK. A macOS-15
    # (SDK 15) build silently fails to launch (exit 1) on macOS 26 — the Swift
    # concurrency runtime mismatch — so the release must be built on 26.
    runs-on: macos-26
    # secrets can't be used in step `if:` directly, so surface them as env flags.
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12
          IDENT=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "CODESIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"

      - name: Build, sign, package
        run: |
          ./scripts/package-app.sh "${{ steps.ver.outputs.version }}"
          ./scripts/make-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Notarize & staple
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > AuthKey.p8
          export NOTARY_KEY_PATH="$PWD/AuthKey.p8"
          ./scripts/notarize.sh "dist/eWiz-${{ steps.ver.outputs.version }}.dmg"
          rm -f AuthKey.p8

      # Always make the build downloadable from the run summary.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eWiz-${{ steps.ver.outputs.version }}
          path: dist/eWiz-${{ steps.ver.outputs.version }}.dmg

      # Generate the update feed pointing at this release's DMG asset.
      - name: Generate appcast
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/eWiz-${{ steps.ver.outputs.version }}.dmg"
          ./scripts/make-appcast.sh "${{ steps.ver.outputs.version }}" "$DMG_URL" "eWiz ${{ steps.ver.outputs.version }}"

      # On a tag push, attach DMG + appcast.json to a published GitHub Release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "eWiz ${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/eWiz-${{ steps.ver.outputs.version }}.dmg
            dist/appcast.json
          draft: false
          make_latest: true
          generate_release_notes: true

      # Point the public in-app update feed at this release. Done inline here
      # rather than in a separate `release: published` workflow because releases
      # published by the default GITHUB_TOKEN do NOT emit an event that can
      # trigger another workflow — so that feed workflow never fired on its own.
      # RELEASES_TOKEN is a PAT with contents:write on the ewiz-releases repo.
      - name: Update appcast feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASES_TOKEN not set — skipping feed update."
            exit 0
          fi
          FEED_REPO="stroke-app/ewiz-releases"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/eWiz-${VERSION}.dmg"
          NEW=$(printf '{"version":"%s","url":"%s","notes":"%s"}' "$VERSION" "$DMG_URL" "eWiz ${VERSION}")
          echo "New feed: $NEW"
          SHA=$(gh api "repos/${FEED_REPO}/contents/appcast.json" --jq .sha)
          gh api -X PUT "repos/${FEED_REPO}/contents/appcast.json" \
            -f message="chore: update appcast to ${VERSION}" \
            -f content="$(printf '%s' "$NEW" | base64 | tr -d '\n')" \
            -f sha="$SHA"
          echo "Feed updated to ${VERSION}."

      # Publish the Homebrew cask to the ewiz-releases tap, with the freshly
      # built DMG's sha256, so `brew install --cask` always matches the release.
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASES_TOKEN not set — skipping cask update."
            exit 0
          fi
          TAP_REPO="stroke-app/homebrew-ewiz"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/eWiz-${VERSION}.dmg"
          DMG_SHA=$(shasum -a 256 "dist/eWiz-${VERSION}.dmg" | awk '{print $1}')
          ./scripts/make-cask.sh "${VERSION}" "${DMG_URL}" "${DMG_SHA}"
          CONTENT=$(base64 < dist/ewiz.rb | tr -d '\n')
          EXISTING=$(gh api "repos/${TAP_REPO}/contents/Casks/ewiz.rb" --jq .sha 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh api -X PUT "repos/${TAP_REPO}/contents/Casks/ewiz.rb" \
              -f message="cask: ewiz ${VERSION}" -f content="$CONTENT" -f sha="$EXISTING"
          else
            gh api -X PUT "repos/${TAP_REPO}/contents/Casks/ewiz.rb" \
              -f message="cask: ewiz ${VERSION}" -f content="$CONTENT"
          fi
          echo "Cask updated to ${VERSION} (sha ${DMG_SHA})."

          # The cask was called battlify before the rename. Homebrew follows a rename
          # only once the old cask is gone and cask_renames.json points across, and then
          # `brew upgrade` moves existing installs over by itself.
          OLD=$(gh api "repos/${TAP_REPO}/contents/Casks/battlify.rb" --jq .sha 2>/dev/null || echo "")
          if [ -n "$OLD" ]; then
            gh api -X DELETE "repos/${TAP_REPO}/contents/Casks/battlify.rb" \
              -f message="cask: battlify is now ewiz" -f sha="$OLD"
          fi
          RENAMES=$(printf '{\n  "battlify": "ewiz"\n}\n' | base64 | tr -d '\n')
          RSHA=$(gh api "repos/${TAP_REPO}/contents/cask_renames.json" --jq .sha 2>/dev/null || echo "")
          if [ -z "$RSHA" ]; then
            gh api -X PUT "repos/${TAP_REPO}/contents/cask_renames.json" \
              -f message="cask: rename battlify to ewiz" -f content="$RENAMES"
          fi
